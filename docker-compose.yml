services:
  app:
    build: .
    container_name: smark-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: smark
      DB_USERNAME: smark
      DB_PASSWORD: secret

  postgres:
    image: postgres:16-alpine
    container_name: smark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smark
      POSTGRES_USER: smark
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - smark_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smark -d smark"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: smark-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  smark_pgdata: